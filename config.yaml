# Crypto LLM Arena configuration.
# Each agent fights to produce the most accurate signals on the top-20 coins.
# Winners gain weight ("decision power") in the consensus signal; losers lose it.

arena:
  top_n_coins: 20
  horizon_hours: 24        # how long until a round's signals are evaluated
  adaptive_eta: true       # eta(t) = sqrt(ln N / t) — optimal Hedge schedule
  eta: 0.35                # fixed learning rate, used only when adaptive_eta is false
  min_weight: 0.05         # no agent's power ever drops below this share
  max_weight: 0.60         # ...or rises above this share
  flat_threshold_pct: 1.0  # moves smaller than this count as "flat"
  fee_rate_bps: 5          # taker fee per side (paper PnL realism)
  db_path: arena.db
  start_equity: 10000      # paper-trading starting equity per agent

# --- Wave-2 feature blocks (all optional; defaults shown in models.py) -----
debate:
  enabled: false           # bull/bear debate brief + critic pass (extra LLM calls)
memory:
  enabled: true            # per-agent lessons injected into prompts
calibration:
  enabled: true            # per-agent Platt calibration of stated probabilities
  method: platt
weights:
  per_asset: true          # W[coin][agent] decision-power matrix
  regime_conditional: true # separate bull/bear/chop weight books
consensus:
  extremize_lambda: 1.3    # Good-Judgment-style extremizing (1.0 = off)
  herding_haircut: 0.85    # confidence haircut when all agents agree
  no_trade_min_confidence: 0.0   # skip the round below this (0 = off)
  mechanism: vote          # vote | lmsr
risk:
  kelly_fraction: 0.25     # fractional-Kelly sizing (0 = legacy equal stake)
  max_position_pct: 10
  daily_loss_limit_pct: 2
  max_drawdown_halt_pct: 15
  min_volume_mcap_ratio: 0.01
  slippage_base_bps: 2
  funding_in_pnl: true
  market_neutral: false
ops:
  json_logs: false
  journal: true            # persist snapshots, raw replies, per-agent cost
  structured_outputs: true # provider-native JSON schema enforcement
exchange:
  connector: paper         # paper | binanceusdm | bybit (live needs `pip install -e ".[live]"`)
  testnet: true

agents:
  - name: claude
    provider: anthropic
    model: claude-opus-4-8
    api_key_env: ANTHROPIC_API_KEY

  - name: gpt
    provider: openai_compat
    base_url: https://api.openai.com/v1
    model: gpt-5
    api_key_env: OPENAI_API_KEY

  - name: gemini
    provider: openai_compat
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-2.5-pro
    api_key_env: GEMINI_API_KEY

  - name: grok
    provider: openai_compat
    base_url: https://api.x.ai/v1
    model: grok-4
    api_key_env: XAI_API_KEY
